services:
  app:
    build:
      context: .
      dockerfile: docker/php-dev.Dockerfile
    ports:
      - "8080:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: otokantar
      DB_USERNAME: otokantar
      DB_PASSWORD: secret
      LEGACY_DB_HOST: mysql
      LEGACY_DB_PORT: 3306
      LEGACY_DB_DATABASE: otokantar
      LEGACY_DB_USERNAME: otokantar
      LEGACY_DB_PASSWORD: secret
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      LEGACY_RUNTIME_PATH: storage/app/legacy_python
      LIVE_INGEST_API_TOKEN: local-dev-token
    volumes:
      - .:/var/www/html
      - storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy

  node:
    image: node:22-alpine
    working_dir: /var/www/html
    command: sh -c "[ -x node_modules/.bin/vite ] || npm ci; npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      APP_URL: http://localhost:8080
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    depends_on:
      - app

  queue:
    build:
      context: .
      dockerfile: docker/php-dev.Dockerfile
    command: php artisan queue:listen --tries=1 --timeout=0
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: otokantar
      DB_USERNAME: otokantar
      DB_PASSWORD: secret
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      LEGACY_RUNTIME_PATH: storage/app/legacy_python
      LIVE_INGEST_API_TOKEN: local-dev-token
    volumes:
      - .:/var/www/html
      - storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: otokantar
      MYSQL_USER: otokantar
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root-secret
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uotokantar", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
  node_modules:
  storage:
