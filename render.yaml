services:
  - type: web
    name: otokantar-v7
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_TIMEZONE
        value: Europe/Istanbul
      - key: APP_LOCALE
        value: tr
      - key: APP_FALLBACK_LOCALE
        value: tr
      - key: ALLOW_PUBLIC_REGISTRATION
        value: false
      - key: RUN_MIGRATIONS
        value: true
      - key: ENSURE_ADMIN
        value: true
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_ENCRYPT
        value: true
      - key: QUEUE_CONNECTION
        value: sync
      - key: LIVE_INGEST_QUEUE
        value: live-ingest
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      - key: APP_KEY
        sync: false
      - key: APP_KEY_BASE64
        generateValue: true
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: otokantar-v7-db
          property: connectionString
      - key: DB_URL
        fromDatabase:
          name: otokantar-v7-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Admin
      - key: LEGACY_RUNTIME_PATH
        value: /var/www/html/storage/app/legacy_python
      - key: LIVE_INGEST_API_TOKEN
        sync: false
      - key: SYSTEM_HEALTH_ALERTS_ENABLED
        value: false
      - key: SYSTEM_HEALTH_ALERT_CUSTOMER
        sync: false
      - key: SYSTEM_HEALTH_ALERT_MIN_LEVEL
        value: warning
      - key: SYSTEM_HEALTH_ALERT_COOLDOWN_MINUTES
        value: 15
      - key: SYSTEM_HEALTH_ALERT_TIMEOUT_SECONDS
        value: 5
      - key: N8N_HEALTH_WEBHOOK_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

databases:
  - name: otokantar-v7-db
    plan: free
